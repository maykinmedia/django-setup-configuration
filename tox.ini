[tox]
envlist =
    py{312,313,314}-django{52,60}-pydantic{20,210}
    ruff
    docs
skip_missing_interpreters = true

[gh-actions]
python =
    3.12: py312
    3.13: py313
    3.14: py314

[gh-actions:env]
DJANGO =
    5.2: django52
    6.0: django60
PYDANTIC =
    2.0: pydantic20
    2.10: pydantic210

[testenv]
setenv =
    DJANGO_SETTINGS_MODULE=testapp.settings
    PYTHONPATH={toxinidir}
extras =
    tests
    coverage
deps =
  django52: Django~=5.2.0
  django60: Django~=6.0.0
  pydantic20: pydantic~=2.0
  pydantic210: pydantic~=2.10
commands =
  py.test tests \
   --cov --cov-report xml:reports/coverage-{envname}.xml \
   {posargs}

[testenv:ruff]
extras = tests
skipsdist = True
commands_pre =
commands =
    ruff check --output-format=github .
    ruff format --check

[testenv:docs]
basepython=python
changedir=docs
skipsdist=true
extras =
    tests
    docs
commands=
    py.test check_sphinx.py -v \
    --tb=auto \
    {posargs}
